# Isolated Test Profile — H2 in MySQL compatibility mode
# Prevents mvn test from modifying or polluting the real paypilot_ai MySQL database.
spring.datasource.url=jdbc:h2:mem:paypilot_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.test.database.replace=none

# Test Flyway migration SQL first; if H2 lacks MySQL-specific syntax, adjust test config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
# Let Hibernate auto-detect H2Dialect for tests while keeping H2 MODE=MySQL for Flyway SQL
spring.jpa.open-in-view=false

# Dummy non-secret placeholders so Spring context tests load without .env
paypal.client-id=test-sandbox-client-id
paypal.client-secret=test-sandbox-client-secret
paypal.mode=sandbox
paypal.base-url=https://api-m.sandbox.paypal.com
paypal.webhook-id=
jwt.secret=test-jwt-secret-placeholder-minimum-32-chars-long
jwt.expiration-ms=86400000
ai.service.url=http://localhost:3001
ai.service.secret=test-ai-service-secret

