# =============================================================================
# PayPilot AI — Spring Boot Application Configuration
# All sensitive values are read from environment variables (via .env or shell).
# =============================================================================

spring.application.name=paypilot-backend
server.port=${SERVER_PORT:8080}

# ----- MySQL DataSource -----
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ----- JPA / Hibernate -----
# validate: Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----- Flyway -----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ----- File Upload (invoice PDFs) -----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----- PayPal (read from env) -----
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}

# ----- JWT -----
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----- AI Service (internal proxy — never exposed to browser) -----
ai.service.url=${AI_SERVICE_URL:http://localhost:3001}
ai.service.secret=${AI_SERVICE_SECRET}
ai.default-model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# ----- Logging -----
logging.level.root=INFO
logging.level.com.paypilot=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ----- CORS (allow React dev server) -----
# CORS policy is configured in SecurityConfig.java
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ----- Email / SMTP (optional — read from env) -----
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
paypilot.mail.enabled=${MAIL_ENABLED:false}
paypilot.mail.from=${MAIL_FROM:no-reply@paypilot.local}
paypilot.mail.resend-cooldown-seconds=${MAIL_RESEND_COOLDOWN_SECONDS:60}

